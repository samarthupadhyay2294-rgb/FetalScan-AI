# Render Blueprint — deploy backend + frontend as separate services
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: fetalscan-ai
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    dockerContext: .
    dockerBuildArgs:
      MODEL_WEIGHTS_URL: https://github.com/samarthupadhyay2294-rgb/FetalScan-AI/releases/download/weight/best_hrnet.pth
    envVars:
      - key: CORS_ORIGINS
        value: https://fetalscan-ai-1.onrender.com
      - key: CORS_ORIGIN_REGEX
        value: https://.*\.onrender\.com
      - key: MODEL_WEIGHTS_PATH
        value: backend/weights/best_hrnet.pth
      - key: DATABASE_URL
        value: sqlite:///./backend/database/fetalscan.db

  - type: web
    name: fetalscan-ai-1
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE
        value: https://fetalscan-ai.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
